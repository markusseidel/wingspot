openapi: 3.1.0
info:
  title: Wingspot API
  version: 1.0.0-draft
  description: |
    Contract between the Wingspot apps and the backend (docs/CONCEPT.md §11.4, §11.5).

    Compatibility rules:
    - Breaking changes only in a new version (`/v2`).
    - Additive changes are allowed in `/v1`, so clients must ignore unknown fields.
    - Fields documented as open string sets may gain values. Clients must handle
      unknown values without crashing, so these fields are not declared as enums.
    - Timestamps are UTC ISO-8601.
servers:
  - url: https://gsfeuxowjymdqbopcpdo.supabase.co/functions
    description: Hosted Supabase Edge Functions.
  - url: '{baseUrl}'
    description: Local Supabase Edge Functions. `/v1/config` resolves to `{baseUrl}/v1/config`.
    variables:
      baseUrl:
        default: http://localhost:54321/functions
        description: Local Supabase default.
tags:
  - name: badges
    description: Badges, XP and levels
  - name: checkins
    description: Check-in upload from the offline outbox
  - name: config
    description: Remote configuration
  - name: devices
    description: Installed app instances and push tokens
  - name: entitlements
    description: Pro status across both stores
  - name: refdata
    description: On-device reference database
security:
  - bearerAuth: []
paths:
  /v1/checkins:
    post:
      tags: [checkins]
      operationId: uploadCheckins
      summary: Upload check-ins from the outbox
      description: |
        Stores 1 to 50 check-ins. Idempotent by check-in `id`: uploading an id that is already
        stored for the same user answers `stored` again, so apps can retry after a lost
        response without creating duplicates. Each item is judged on its own, so one rejected
        item never blocks the others. The HTTP status is 200 whenever the request itself
        was valid, and each item's `status` says what happened.

        Only `spotted` check-ins are accepted for now. A check-in is `private` unless the app
        sends another visibility. Apps retry network errors and 5xx answers, and never retry
        a `rejected` item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinUpload'
      responses:
        '200':
          description: One result per uploaded check-in, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Get remote configuration
      description: Public, because apps must check their minimum version before sign-in.
      security: []
      responses:
        '200':
          description: Current configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register or refresh a device
      description: |
        Called on launch and when the push token changes. Idempotent by device `id`.
        The latest account to register a device owns it, and a push token belongs to only
        one device, so a phone that changes accounts stops getting the old account's pushes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '200':
          description: The device was registered or refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/devices/{id}:
    delete:
      tags: [devices]
      operationId: unregisterDevice
      summary: Unregister a device on sign-out
      description: Idempotent. Also returns 204 if the device no longer exists.
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID generated by the app on first launch.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The device is no longer registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/entitlements:
    get:
      tags: [entitlements]
      operationId: getMyEntitlements
      summary: Get the current user's entitlements
      description: |
        Apps must use this rather than the local store receipt to decide Pro status,
        so a purchase on one platform applies on the other.
      responses:
        '200':
          description: The user's entitlements. Empty if the user never had any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/me/progress:
    get:
      tags: [badges]
      operationId: getMyProgress
      summary: Get the current user's XP, level and badge progress
      description: |
        Also catches up on badges for check-ins uploaded before badges existed. Apps compare the
        returned `level` of each badge with the levels they have already shown, and celebrate the
        difference. They must not rely on the upload answer alone, because that answer can be lost
        or can arrive on another device. On the first fetch after sign-in or a reinstall, apps record
        what is unlocked without celebrating it.

        Hidden badges appear only once earned. `hidden_remaining` counts the others. Dormant badges,
        whose data doesn't exist yet, are left out.
      responses:
        '200':
          description: The user's progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/refdata/manifest:
    get:
      tags: [refdata]
      operationId: getRefdataManifest
      summary: Get the current reference database snapshot
      description: |
        Public, because reference data is needed before sign-in. All fields except `url`
        come from the `manifest.json` written by `backend/refdata-pipeline`.
      security: []
      responses:
        '200':
          description: The current snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefdataManifest'
        '404':
          description: No snapshot has been published yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.
  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The server failed to handle the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Visibility:
      type: string
      description: Open string set.
      examples: [private]
    CheckinItem:
      type: object
      required: [id, kind, occurred_at]
      description: |
        A spotted check-in needs a registration or a type. The type is whatever the user
        entered, and it stays on this check-in only.
      properties:
        id:
          type: string
          format: uuid
          description: Generated on the device.
        kind:
          type: string
          description: Open string set. Only `spotted` is accepted for now.
          examples: [spotted]
        occurred_at:
          type: string
          format: date-time
        registration:
          type: string
          description: Canonical form, such as `D-AIMA`.
        type_icao:
          type: string
          examples: [A388]
        airport_id:
          type: integer
        latitude:
          type: number
          description: Both latitude and longitude, or neither. Stored privately and never shown to others.
        longitude:
          type: number
        visibility:
          $ref: '#/components/schemas/Visibility'
    CheckinUpload:
      type: object
      required: [checkins]
      properties:
        checkins:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CheckinItem'
    CheckinResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            `stored` means the server has it, including a repeat of an earlier upload.
            `rejected` is final: retrying the same item gets the same answer. Open string set.
          examples: [stored]
        code:
          type: string
          description: |
            Present when rejected. Open string set. Values today: `unsupported_kind`,
            `missing_aircraft`, `invalid_registration`, `invalid_time`, `unknown_type`,
            `unknown_airport`, `invalid_location`, `invalid_visibility`, `id_taken`,
            `invalid_request`.
    CheckinUploadResult:
      type: object
      required: [results]
      description: |
        `badges_unlocked`, `xp` and `level` are present when the server could work out badges for this
        upload. They are a fast path only: a repeated upload answers with no new unlocks, so apps get
        the full picture from `GET /v1/me/progress`.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CheckinResult'
        badges_unlocked:
          type: array
          items:
            $ref: '#/components/schemas/BadgeUnlock'
        xp:
          type: integer
        level:
          type: integer
    LocalizedText:
      type: object
      required: [en]
      description: Text by language code. `en` is always there. Apps use the phone's language and fall back to `en`.
      additionalProperties:
        type: string
      examples:
        - {en: Wheels Up, de: Abheben}
    BadgeUnlock:
      type: object
      required: [id, level, name]
      properties:
        id:
          type: string
        level:
          type: integer
          description: The highest level reached. A jump over several levels reports only the last one.
        previous_level:
          type: integer
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        category:
          type: string
          description: Open string set.
        kind:
          type: string
          description: Open string set. `single` or `leveled` today.
    BadgeProgress:
      type: object
      required: [id, name, levels, value, level]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        category:
          type: string
          description: Open string set.
        kind:
          type: string
          description: Open string set.
        hidden:
          type: boolean
        levels:
          type: array
          items:
            type: integer
          description: The value needed for each level, ascending. One entry for a single badge.
        value:
          type: integer
          description: The current value of the badge's metric.
        level:
          type: integer
          description: The highest level unlocked. 0 if none, and it never goes down.
        unlocked_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the latest level was unlocked.
    Progress:
      type: object
      required: [xp, level, xp_for_level, xp_for_next_level, badges, hidden_remaining]
      properties:
        xp:
          type: integer
        level:
          type: integer
        xp_for_level:
          type: integer
          description: The XP at which the current level starts.
        xp_for_next_level:
          type: integer
        badges:
          type: array
          description: In display order.
          items:
            $ref: '#/components/schemas/BadgeProgress'
        hidden_remaining:
          type: integer
          description: How many hidden badges are still locked.
    Platform:
      type: string
      enum: [ios, android]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable identifier. Open string set.
          examples: [invalid_request]
        message:
          type: string
          description: Developer-facing description. Not for display to users.
    Config:
      type: object
      required: [min_version, feature_flags]
      properties:
        min_version:
          type: object
          description: Apps below their platform's version show a "please update" screen.
          required: [ios, android]
          properties:
            ios:
              type: string
              examples: [0.1.0]
            android:
              type: string
              examples: [0.1.0]
        feature_flags:
          type: object
          description: |
            Feature flags and kill switches for this platform set. Open key set:
            treat a missing flag as disabled.
          additionalProperties:
            type: boolean
    DeviceRegistration:
      type: object
      required: [id, platform, app_version]
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the app on first launch.
        platform:
          $ref: '#/components/schemas/Platform'
        push_token:
          type: [string, 'null']
          description: APNs token on iOS, FCM token on Android.
        push_env:
          type: [string, 'null']
          enum: [sandbox, production, null]
          description: APNs environment. Null on Android.
        app_version:
          type: string
          examples: [0.1.0]
        os_version:
          type: [string, 'null']
          examples: ['18.0']
        locale:
          type: [string, 'null']
          examples: [de-DE]
    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceRegistration'
        - type: object
          required: [last_seen_at]
          properties:
            last_seen_at:
              type: string
              format: date-time
    Entitlement:
      type: object
      required: [entitlement, store, product_id, status]
      properties:
        entitlement:
          type: string
          description: Open string set.
          examples: [pro]
        store:
          type: string
          description: Open string set. Known values are app_store, play_store and promo.
          examples: [app_store]
        product_id:
          type: string
          examples: [pro_yearly]
        status:
          type: string
          description: |
            Open string set. Known values are active, grace_period, billing_retry,
            expired and revoked. Treat unknown values as not entitled.
          examples: [active]
        expires_at:
          type: [string, 'null']
          format: date-time
        auto_renew:
          type: [boolean, 'null']
    EntitlementList:
      type: object
      required: [entitlements]
      properties:
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
    RefdataManifest:
      type: object
      required: [schema_version, data_version, url, sha256, size_bytes]
      properties:
        schema_version:
          type: integer
          description: |
            Version of contracts/refdata/schema.sql. Apps must not open a snapshot whose
            schema version they don't support.
          examples: [2]
        data_version:
          type: string
          description: Identifies the data in this snapshot. Compare for equality only.
          examples: ['2026-11-04']
        url:
          type: string
          format: uri
          description: Where to download the snapshot.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Checksum of the snapshot file.
        size_bytes:
          type: integer
          minimum: 0
