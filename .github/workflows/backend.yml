name: Backend

# The workflow starts for every pull request, so its checks can be required. The first job works out whether
# anything here changed, and the others are skipped when nothing did. A skipped job counts as passing.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to the same pull request replaces the run that is still going.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            changed=$(git diff --name-only HEAD^1 HEAD)
          fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(backend/|contracts/|\.github/workflows/backend\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  refdata-pipeline:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/refdata-pipeline/tests/test_build_refdata.py

  supabase:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start local stack
        run: supabase start --workdir backend -x studio,imgproxy,logflare,vector,mailpit,supavisor,realtime
      - name: Test database access rules
        run: supabase test db --workdir backend
      - name: Test API against the contract
        working-directory: backend/api-tests
        run: |
          npm ci
          npm test
