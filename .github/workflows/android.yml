name: Android

# One Linux job. It starts for every pull request, so its check can be required, and does the real work only when
# something under android/, contracts/ (the shared test vectors) or this file changed. A skipped job counts as passing.
# Draft pull requests are skipped too: mark the pull request ready for review to run it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(android/|contracts/|\.github/workflows/android\.yml)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: changes
    if: >
      needs.changes.outputs.android == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already has the Android SDK; only platform 37 is missing.
      - name: Install the SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared logic tests (boarding pass, registrations, distances, sign-in)
        run: ./gradlew :core:test
      - name: Build the app
        run: ./gradlew :app:assembleDebug
