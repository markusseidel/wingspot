name: Android beta

# Builds the app for testers. Run it by hand (Actions > Android beta > Run workflow).
# - Always: an installable debug APK as a build artifact, to send to friends who can install files from outside Google Play.
# - With the signing secrets set: a signed release bundle (.aab) for Google Play's internal testing track.
# See docs/ANDROID-BETA.md for the one-time setup.
# - With the Firebase secrets set: the debug APK is also sent to the testers of Firebase App Distribution
#   (the Android counterpart of TestFlight).
on:
  workflow_dispatch:
    inputs:
      group:
        description: Firebase App Distribution group that gets the build
        default: freunde
      notes:
        description: Release notes for the testers (optional)
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      WINGSPOT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      WINGSPOT_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      WINGSPOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      WINGSPOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      WINGSPOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      # Push needs the Firebase project's file. Without the secret the app still works, just without push.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      # The version code is the date and the number of this run today, like 202611191 then 202611192, the same as the
      # iOS build number. It always goes up, which Google Play needs. A tenth run in one day is refused, because
      # it would be higher than every run of the days after it.
      - name: Version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Europe/Berlin date +%Y%m%d)
          since=$(TZ=Europe/Berlin date -d "$day 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/android-beta.yml/runs?created=%3E%3D$since&per_page=1" --jq .total_count)
          if [ -z "$runs" ] || [ "$runs" -lt 1 ] || [ "$runs" -gt 9 ]; then
            echo "Can't make a version code: $runs runs of this workflow today (1 to 9 are possible)." >&2
            exit 1
          fi
          echo "WINGSPOT_VERSION_CODE=$day$runs" >> "$GITHUB_ENV"
          echo "Version code $day$runs"
      - name: Shared logic tests
        run: ./gradlew :core:test --no-daemon
      - name: Debug APK
        run: ./gradlew :app:assembleDebug -PwingspotVersionCode=$WINGSPOT_VERSION_CODE --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wingspot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Sends the debug APK to the testers' group. Skipped without the Firebase secrets.
      - name: Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.group }}
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: ${{ inputs.notes }}
      - name: Signed release bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key set: skipping the release bundle."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          WINGSPOT_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease -PwingspotVersionCode=$WINGSPOT_VERSION_CODE --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        with:
          name: wingspot-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
