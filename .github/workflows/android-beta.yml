name: Android beta

# Builds the app for testers. Run it by hand (Actions > Android beta > Run workflow).
# - Always: an installable debug APK as a build artifact, to send to friends who can install files from outside Google Play.
# - With the signing secrets set: a signed release bundle (.aab) for Google Play's internal testing track.
# See docs/ANDROID-BETA.md for the one-time setup.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      WINGSPOT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      WINGSPOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      WINGSPOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      WINGSPOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      # Push needs the Firebase project's file. Without the secret the app still works, just without push.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Shared logic tests
        run: ./gradlew :core:test --no-daemon
      - name: Debug APK
        run: ./gradlew :app:assembleDebug -PwingspotVersionCode=${{ github.run_number }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wingspot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Signed release bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key set: skipping the release bundle."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          WINGSPOT_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease -PwingspotVersionCode=${{ github.run_number }} --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        with:
          name: wingspot-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
