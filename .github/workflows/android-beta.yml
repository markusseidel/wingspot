name: Android beta

# Builds the app for testers. Run it by hand (Actions > Android beta > Run workflow).
# - Always: an installable debug APK as a build artifact, to send to friends who can install files from outside Google Play.
# - With the signing secrets set: a signed release bundle (.aab) for Google Play's internal testing track.
# See docs/ANDROID-BETA.md for the one-time setup.
# - With the Firebase secrets set: the debug APK is also sent to the testers of Firebase App Distribution
#   (the Android counterpart of TestFlight).
on:
  workflow_dispatch:
    inputs:
      group:
        description: Firebase App Distribution group that gets the build
        default: freunde
      notes:
        description: Release notes for the testers (optional)
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      WINGSPOT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      WINGSPOT_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      WINGSPOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      WINGSPOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      WINGSPOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      # Push needs the Firebase project's file. Without the secret the app still works, just without push.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      # The version code is the date and the number of this run today with two digits, like 2026112210 then 2026112211.
      # It always goes up, which Google Play needs: from 22 November 2026 it has ten digits, more than the nine of the
      # earlier ones (the iOS build number is still the date and one digit). A hundredth run in one day is refused.
      - name: Version code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Europe/Berlin date +%Y%m%d)
          since=$(TZ=Europe/Berlin date -d "$day 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/android-beta.yml/runs?created=%3E%3D$since&per_page=1" --jq .total_count)
          if [ -z "$runs" ] || [ "$runs" -lt 1 ] || [ "$runs" -gt 99 ]; then
            echo "Can't make a version code: $runs runs of this workflow today (1 to 99 are possible)." >&2
            exit 1
          fi
          code=$(printf '%s%02d' "$day" "$runs")
          echo "WINGSPOT_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Version code $code"
      # The beta APK is a debug build. A fresh runner makes a new debug key every time, so every build had another signature: testers
      # had to uninstall before each update, and a Google Maps key cannot be restricted to a fingerprint that keeps changing. With the
      # secret the debug build is signed with one fixed key (build.gradle.kts reads its path from WINGSPOT_BETA_KEYSTORE).
      - name: Fixed signing key for the beta
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BETA_KEYSTORE_BASE64" ]; then
            printf '%s' "$BETA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta.keystore"
            echo "WINGSPOT_BETA_KEYSTORE=$RUNNER_TEMP/beta.keystore" >> "$GITHUB_ENV"
          else
            echo "No BETA_KEYSTORE_BASE64 secret: the beta is signed with a new debug key this run."
          fi
      - name: Shared logic tests
        run: ./gradlew :core:test --no-daemon
      - name: Debug APK
        run: ./gradlew :app:assembleDebug -PwingspotVersionCode=$WINGSPOT_VERSION_CODE --no-daemon
      # Says which key signed the APK, so a wrong key shows in the log (the Maps key only accepts the beta key's fingerprint).
      - name: Signing fingerprint of the APK
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "DN|SHA-1"
          if [ -n "$WINGSPOT_BETA_KEYSTORE" ] && ! "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -q "CN=Wingspot Beta"; then
            echo "The APK is not signed with the beta key." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wingspot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Sends the debug APK to the testers' group. Skipped without the Firebase secrets.
      - name: Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.group }}
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: ${{ inputs.notes }}
      - name: Signed release bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key set: skipping the release bundle."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          WINGSPOT_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease -PwingspotVersionCode=$WINGSPOT_VERSION_CODE --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        with:
          name: wingspot-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
