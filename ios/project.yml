# Generate Wingspot.xcodeproj with: xcodegen generate (run in ios/)
name: Wingspot
options:
  bundleIdPrefix: app.wingspot
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WingspotCore:
    path: Packages/WingspotCore
  BCBP:
    path: Packages/BCBP
targets:
  Wingspot:
    type: application
    platform: iOS
    sources: [Wingspot]
    dependencies:
      - package: WingspotCore
      - package: BCBP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wingspot.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Wingspot/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wingspot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
schemes:
  Wingspot:
    build:
      targets:
        Wingspot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: WingspotCore/WingspotCoreTests
        - package: BCBP/BCBPTests
